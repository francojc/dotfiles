# Overrides sourced last from Omarchy's ~/.config/tmux/tmux.conf (see the
# `source-file -q` line there), so these win over Omarchy's defaults.
#
# Generated from the Home Manager tmux module (.config/nix/modules/arch/tmux.nix,
# evaluated for homeConfigurations.omarchy) and rewritten to load plugins from
# the Nix profile instead of Home Manager store paths. Colours are left to
# Omarchy's theme engine (no theming block here).
#
# Regenerate after changing the module (run from ~/.dotfiles/.config/nix):
#   nix eval --raw .#homeConfigurations.omarchy.config.xdg.configFile.\"tmux/tmux.conf\".text
# then rewrite /nix/store/*/share/tmux-plugins to ~/.nix-profile/share/tmux-plugins.
set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1





set -g status-keys vi
set -g mode-keys   vi



# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix




set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     100000

# ============================================= #
# Plugins come from the Nix profile (packages in hosts/omarchy/packages.nix).
# --------------------------------------------- #

# tmuxplugin-fzf-tmux-url
# ---------------------

run-shell ~/.nix-profile/share/tmux-plugins/fzf-tmux-url/fzf-url.tmux


# tmuxplugin-vim-tmux-navigator
# ---------------------

run-shell ~/.nix-profile/share/tmux-plugins/vim-tmux-navigator/vim-tmux-navigator.tmux


# tmuxplugin-yank
# ---------------------

run-shell ~/.nix-profile/share/tmux-plugins/yank/yank.tmux

# ============================================= #

# -------------------------------------------------
# GENERAL SETTINGS
# -------------------------------------------------

# Unbind default prefix and set new one
unbind C-b
bind C-a send-prefix

# Clipboard support
set -g set-clipboard on

# True color support for modern terminals
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",*256col*:RGB"

# Pane base index
setw -g pane-base-index 1

# Server behavior
set -s focus-events on
set -s extended-keys on
set -s escape-time 0
set -g detach-on-destroy off

# For PI
set -s extended-keys-format csi-u

# Window behavior
set -g renumber-windows on
set-window-option -g automatic-rename on
set-option -g set-titles on

# Image preview for Yazi
set -gq allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Misc settings
set -g allow-rename off
set -g visual-activity off
set -g display-time 1500
set -g status-keys vi

# -------------------------------------------------
# KEY BINDINGS
# -------------------------------------------------

# Global bindings
bind R source-file ~/.config/tmux/tmux.conf \; display-message "TMUX config reloaded!"
bind P paste-buffer
bind S new-session

# Copy mode bindings
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Session bindings
bind-key n switch-client -n   # Go to the next session
bind-key p switch-client -p   # Go to the previous session
bind-key a switch-client -l   # Toggle to the last session

# Window bindings
bind W new-window -c "#{pane_current_path}"
bind -r Tab next-window

# Select specific windows
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5

# Swap windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Kill window
bind q kill-window

# Floating session popup (in current path), use detach to close
bind-key f display-popup -w 80% -h 60% -E "tmux new-session -s popup -c '#{pane_current_path}' \\; set-option destroy-unattached on"

# Popups
# Obsidian vault popup which opens `~/Obsidian/Notes/Daily/{current_date}.md` in Neovim
bind-key o display-popup -w 80% -h 60% -d ~/Obsidian/Notes -T "Obsidian Daily Note" -E "nvim ~/Obsidian/Notes/plan/daily/$(date +'%Y-%m-%d').md"

# Floating Git status popup using lazygit
bind-key g display-popup -w 80% -h 60% -d '#{pane_current_path}' -T "Git Status" -E lazygit

# Floating calendar popup
bind-key c display-popup -w 60% -h 40% -T "Calendar" -k "gcal -K .."

# Jump to Pi agents awaiting attention
bind-key N run-shell 'pi-waiting --last'
bind-key C-n display-popup -w 90% -h 70% -T "Awaiting Pi agents" -E 'pi-waiting'

# kill pane
bind x kill-pane

# Rename session/window
bind \" command-prompt -p "rename-session:" "rename-session '%%'"
bind \' command-prompt -p "rename window:" "rename-window %%"

# Pane bindings - split panes (using original tmux.conf logic)
bind h split-window -h -b -t:+0 -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"
bind k split-window -v -b -t:+0 -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap panes
bind-key M command-prompt -p "move pane to:" "swap-pane -s '%%' -t ."

# Join pane to current window
bind ¡ choose-window 'join-pane -s "%%"'

# -------------------------------------------------
# OMARCHY PORT EXTRAS (kept from the earlier hand port)
# -------------------------------------------------
# Omarchy sets a second prefix; the generated config above does not clear it.
set -gu prefix2
