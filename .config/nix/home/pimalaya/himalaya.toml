# himalaya + himalaya-tui share this file.
# Mode B: live IMAP/SMTP, parallel to aerc. Pass creds mirror aerc/accounts.conf.

# ---------------------------------------------------------------------------
# Gmail (work) -- francojc@wfu.edu
# ---------------------------------------------------------------------------
[accounts.gmail]
default = true
email = "francojc@wfu.edu"
display-name = "Jerid Francom"
signature-file = "~/.config/aerc/work-signature.md"

imap.server = "imaps://imap.gmail.com:993"
imap.sasl.plain.username = "francojc@wfu.edu"
imap.sasl.plain.password.command = ["pass", "show", "EMAIL/GMAIL"]

smtp.server = "smtps://smtp.gmail.com:465"
smtp.sasl.plain.username = "francojc@wfu.edu"
smtp.sasl.plain.password.command = ["pass", "show", "EMAIL/GMAIL"]

mailbox.alias.inbox = "INBOX"
mailbox.alias.sent = "[Gmail]/Sent Mail"
mailbox.alias.drafts = "[Gmail]/Drafts"
mailbox.alias.trash = "[Gmail]/Trash"
mailbox.alias.archive = "[Gmail]/All Mail"
message.send.save-copy = "sent"

# ---------------------------------------------------------------------------
# Mailbox.org (personal) -- thatdude@mailbox.org with aliases
# ---------------------------------------------------------------------------
[accounts.mailbox]
email = "thatdude@mailbox.org"
display-name = "Jerid Francom"
