theme = "gruvbox-dark"
diff_view = "side-by-side"   # or "unified"
ignore_whitespace = false    # ignore all whitespace in local VCS diffs
appearance = "dark"        # or "dark" / "light"
mouse = true
leader = ";"                  # configurable prefix for leader shortcuts
comment_vim = false           # vim modal editing in the review comment box
review_watch_interval_ms = 1000 # set to 0 to disable persisted-review polling
no_update_check = true

comment_types = [
  { id = "note", color = "orange", label = "question", definition = "ask for clarification"},
  { id = "suggestion", color = "yellow", definition = "possible improvements" },
  { id = "issue", color = "red", definition = "problems to fix" },
  { id = "praise", color = "green", definition = "positive feedback" },
  { id = "nit", color = "blue", label = "nitpick", definition = "small optional tweaks" },
]
