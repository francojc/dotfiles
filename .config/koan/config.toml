# koan — shareable defaults (safe to commit to dotfiles)
# Uncomment to customise. Run `koan config` to see resolved values.
#
# Machine-scoped settings (library folders, the remote server, output device,
# cache paths and limits, UI toggles) belong in config.local.toml, not here.

[playback]
replaygain = "track"
target_fps = 30
show_fps = false
pre_amp_db = 0.0

[remote]
download_workers = 5
auto_sync = true
auto_sync_interval_mins = 60

[organize]
default = "standard"

[visualizer]
fps = 60
scale = "bark"
amplitude_scale = "aweight"
bar_decay_ms = 50
peak_decay_ms = 180
palette = "mono"
reactivity = 1.0
reactive_bg = false

[graphql]
enabled = true
port = 4000
bind = "127.0.0.1"
playground = false
auth_enabled = true
access_token_ttl = "15m"
refresh_token_ttl = "30d"
cors_origins = []
